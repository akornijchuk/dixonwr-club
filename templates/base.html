<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}DixonWR CRM{% endblock %}</title>
  <!-- Sleek Custom Vector Hanger SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23ed1028%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M12 2a3 3 0 0 0-3 3c0 .8.3 1.5.8 2L2 14v3a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-3l-7.8-7c.5-.5.8-1.2.8-2a3 3 0 0 0-3-3z%22/></svg>">
  <link rel="stylesheet" href="/static/css/style.css?v=mobile1">
  <script src="/static/js/customers.js?v=mobile1" defer></script>
</head>
<body>
  <!-- Overlay for mobile drawer -->
  <div class="mobile-sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileSidebar(false)"></div>

  <div class="app-shell">
    <aside class="sidebar" id="appSidebar">
      <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
        <a class="brand" href="/">
          <span>DIXONWR</span>
          <span class="brand-badge">CRM</span>
        </a>
        <button class="mobile-close-btn" type="button" onclick="toggleMobileSidebar(false)">✕</button>
      </div>
      
      <nav aria-label="Основная навигация">
        <a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="/">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          Главная
        </a>
        <a class="nav-link {% if active_page == 'customers' %}active{% endif %}" href="/customers">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          Клиенты
        </a>
        <a class="nav-link {% if active_page == 'orders' %}active{% endif %}" href="/orders">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          Заказы
        </a>
        <a class="nav-link {% if active_page == 'products' %}active{% endif %}" href="/products">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h10M7 11h10M7 15h10M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
          Каталог
        </a>
        <a class="nav-link {% if active_page == 'analytics' %}active{% endif %}" href="/analytics">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          Аналитика
        </a>
      </nav>
      <div class="sidebar-footer">GOOD PEOPLE WEAR DIXONWR</div>
    </aside>

    <main class="main-content">
      
<header class="topbar">
  <button class="mobile-nav-toggle" type="button" onclick="toggleMobileSidebar(true)">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="topbar-title">DixonWR CRM</div>
  <div class="topbar-actions">
    <form action="/logout" method="post">
      <button class="logout-button" type="submit">Выход</button>
    </form>
  </div>
</header>

      <div class="page-content">{% block content %}{% endblock %}</div>
    </main>
  </div>
</body>
</html>
